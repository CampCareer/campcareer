name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Generate CI dependency fixes
        run: |
          npm view js-yaml@3.15.1 version
          npm install --package-lock-only --ignore-scripts --save-dev @types/pg@latest
          npm pkg set 'overrides.gray-matter.js-yaml=3.15.1'
          npm install --package-lock-only --ignore-scripts
      - name: Upload generated dependency manifests
        uses: actions/upload-artifact@v4
        with:
          name: ci-dependency-fix
          path: |
            package.json
            package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
