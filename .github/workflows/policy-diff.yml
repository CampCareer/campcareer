name: Policy source diff

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Compare official policy sources
        run: npm run policy:check
      - name: Upload review-required report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: policy-review-required
          path: data/policy-review-required.json
          if-no-files-found: warn
